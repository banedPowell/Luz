name: Feature
description: A user need to cover
labels: [feature]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: Who needs it and why? Describe the problem rather than the solution.
      placeholder: As a user, I want… so that…
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: What must be true for this issue to be done.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Intended approach, affected areas, alternatives ruled out.

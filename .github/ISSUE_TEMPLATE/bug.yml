name: Bug
description: Something behaves incorrectly or unexpectedly
labels: [bug]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: The observed behaviour, with the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste a playlist URL on the downloads page
        2. Start the download
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: v0.3.1 · Windows 11 · Firefox · yt-dlp 2026.10.01
  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots, leads
      description: Job logs, server output, anything that helps.

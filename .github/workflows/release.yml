name: Release

# Every push to main is a delivery: the next version is read from the
# Conventional Commits since the last tag, then tagged and released with notes
# GitHub groups by PR label (.github/release.yml). Nothing is committed back,
# so main never drifts from dev.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          subjects=$(git log --format=%s "$range")
          bodies=$(git log --format=%B "$range")

          if grep -qE '^[a-z]+(\(.+\))?!:' <<<"$subjects" || grep -q '^BREAKING CHANGE' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\(.+\))?:' <<<"$subjects"; then
            bump=minor
          elif grep -qE '^(fix|perf)(\(.+\))?:' <<<"$subjects"; then
            bump=patch
          else
            echo "Nothing to release since ${last:-the beginning}"
            exit 0
          fi

          IFS=. read -r major minor patch <<<"${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          # Before 1.0 a breaking change only bumps the minor
          if [ "$bump" = major ] && [ "$major" -eq 0 ]; then bump=minor; fi
          case $bump in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac

          echo "${last:-none} -> v$next ($bump)"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

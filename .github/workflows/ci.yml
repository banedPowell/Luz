name: CI

# The "Check" job is a required status check on dev and main.
# The commands mirror the local checks described in CONTRIBUTING.md.
on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bootstrap guard, removed once the monorepo is scaffolded (#1)
      - name: Detect workspace
        id: workspace
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No package.json yet, checks are skipped until the monorepo is scaffolded (#1)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.workspace.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Install Node
        if: steps.workspace.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Format, lint, types
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm exec vp check

      - name: Nuxt typecheck
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm exec vp run typecheck

      - name: Tests
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm exec vp run test

      - name: Build
        if: steps.workspace.outputs.ready == 'true'
        run: pnpm exec vp run build

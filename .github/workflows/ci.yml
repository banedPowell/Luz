name: CI

# The "Check" job is a required status check on dev and main.
# The commands mirror the local checks described in CONTRIBUTING.md.
on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, types
        run: pnpm exec vp check

      - name: Nuxt typecheck
        run: pnpm exec vp run typecheck

      - name: Tests
        run: pnpm exec vp run test

      - name: Build
        run: pnpm exec vp run build

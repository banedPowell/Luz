name: CI

# The "Check" job is a required status check on dev and main.
# The commands mirror the local checks described in CLAUDE.md.
on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The prepare script would install the Git hook dispatcher, useless on a runner
  VP_GIT_HOOKS: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs vp (version from the lockfile), Node from .nvmrc and pnpm
      # from packageManager, then runs `vp install` with a frozen lockfile.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Format, lint, types
        run: vp check

      - name: Nuxt typecheck
        run: vp run typecheck

      # The browser test of the app shell drives Chromium through playwright-core.
      # Only the headless shell is needed. Not cached: Playwright documents a cache
      # restore as no faster than the download, and the system packages cannot be cached.
      - name: Install Chromium for the browser tests
        working-directory: apps/web
        run: vp exec playwright-core install --with-deps --only-shell chromium

      - name: Tests
        run: vp run test

      - name: Build
        run: vp run build
